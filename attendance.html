<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الدوام</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css"><link rel="stylesheet" href="style.css"><link rel="manifest" href="manifest.json"></head><body>

<main class="main-container"><div class="card form-card mb-4"><div class="card-header"><i class="fa-solid fa-user-clock me-2"></i> تسجيل الدوام</div><div class="card-body"><p class="text-muted">سيتم تسجيل التاريخ والوقت تلقائياً.</p><form id="attendanceForm"><div class="row g-3"><div class="col-md-4"><label class="form-label fw-bold">حالة الدوام</label><select id="attendanceStatus" class="form-select" required><option value="">جار التحميل...</option></select></div><div class="col-md-8" id="attendanceStatementWrap"><label class="form-label fw-bold">بيان الدوام</label><input id="attendanceStatement" class="form-control" required maxlength="250" placeholder="دوام عادي أو مهمة ميدانية"></div><div class="col-md-8 d-none" id="medicalReportWrap"><label class="form-label fw-bold">التقرير الطبي (PDF أو صورة)</label><input type="file" id="medicalReportFile" class="form-control" accept="application/pdf,image/*"><small class="text-muted d-block mt-1">مطلوب عند اختيار حالة "اجازة مرضية". الحد الأقصى لحجم الملف 5 ميجابايت.</small></div><div class="col-12"><label class="form-label fw-bold">الملاحظات</label><textarea id="attendanceNotes" class="form-control" rows="2" maxlength="500"></textarea></div></div><button class="btn btn-primary mt-4" type="submit"><i class="fa-solid fa-check me-1"></i> تسجيل الدوام</button><div id="attendanceStatusMessage"></div></form></div></div>
<div class="card history-card"><div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-2"><h5 class="mb-0"><i class="fa-solid fa-list-check me-2"></i> سجل الدوام</h5><div class="d-flex gap-2"><div id="attendanceEmployeeFilterWrap" class="d-none"><select id="attendanceEmployeeFilter" class="form-select form-select-sm"></select></div><select id="attendanceFilterStatus" class="form-select form-select-sm"><option value="">كل الحالات</option></select><span id="attendanceCount" class="badge bg-primary">0 سجل</span></div></div><div class="table-responsive"><table class="table table-bordered table-hover mb-0"><thead class="table-light"><tr><th>Timestamp</th><th>Username</th><th>حالة الدوام</th><th>بيان الدوام</th><th>الملاحظات</th><th>التقرير الطبي</th></tr></thead><tbody id="attendance-table-body"></tbody></table></div></div></main><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script><script src="core.js"></script><script src="page-attendance.js"></script>
