<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سجل التعديلات - لوحة التحكم</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0d6efd">
</head>
<body>

    <!-- =========== NAVBAR START =========== -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white shadow-sm">
        <div class="container-fluid">
            <a class="navbar-brand" href="reports.html">
                <i class="fa-solid fa-file-lines"></i>
                لوحة التحكم
            </a>&nbsp;&nbsp;
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav mb-2 mb-lg-0">
                    <li class="nav-item">
                        <a class="nav-link nav-link-reports" href="reports.html">إدخال التقارير</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-history" href="history.html">سجل التعديلات</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link nav-link-movement" href="materialsMovement.html">سحب / مرتجع مواد</a>
                    </li>
                    <li class="nav-item"><a class="nav-link nav-link-attendance" href="attendance.html">الدوام</a></li>
                    <li class="nav-item"><a class="nav-link nav-link-dashboard" href="dashboard.html">التحليلات</a></li>
                    
                </ul>
                <div class="d-flex align-items-center me-auto">
                    <button type="button" class="btn btn-sm btn-outline-primary me-2" data-refresh-cache title="جلب أحدث البيانات من Google Sheets">
                        <i class="fa-solid fa-arrows-rotate me-1"></i>تحديث البيانات
                    </button>
                    <button type="button" class="dark-mode-toggle me-2" id="darkModeToggle" title="تبديل الوضع الداكن/الفاتح">
                        <i class="fa-solid fa-moon"></i><i class="fa-solid fa-sun"></i>
                    </button>
                    <span id="welcomeMessage" class="navbar-text me-3"></span>&nbsp;&nbsp;
                    <button id="logoutBtn" class="btn btn-sm btn-outline-danger"><i class="fa-solid fa-sign-out-alt me-1"></i>تسجيل الخروج</button>
                </div>
            </div>
        </div>
    </nav>
    <!-- =========== NAVBAR END =========== -->
    <div id="offline-status" class="position-fixed top-0 start-50 translate-middle-x mt-2 px-3 py-2 rounded-pill shadow-sm small fw-bold" style="z-index:1080;display:none;"></div>

    <div class="main-container">
        <div class="card history-card">
            <div class="card-header bg-white d-flex flex-wrap justify-content-between align-items-center gap-3">
                <h5 class="mb-0 text-dark"><i class="fa-solid fa-history me-2"></i><span id="historyTitle">سجل تقاريري</span></h5>
                <div class="d-flex align-items-center gap-2 flex-wrap">
                    <div id="historyEmployeeFilterWrap" class="d-none">
                        <select id="historyEmployeeFilterSelect" class="form-select form-select-sm" style="min-width:190px;"></select>
                    </div>
                    <span id="reportsCount" class="badge bg-primary fs-6">0 تقرير</span><div class="search-bar"><input type="text" id="searchInput" class="form-control form-control-sm" placeholder="ابحث في تقاريرك..."><i class="fa fa-search"></i></div>
                    <button type="button" class="btn btn-sm btn-outline-success" id="exportHistoryCSV" title="تصدير التقارير إلى CSV"><i class="fa-solid fa-file-csv me-1"></i>تصدير CSV</button>
                </div>
            </div>
            <div class="card-body">
                <div class="accordion" id="reports-accordion"></div>
                <div id="no-results-message" class="alert alert-secondary text-center d-none"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="core.js"></script>
    <script src="page-history.js"></script>

<script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => navigator.serviceWorker.register('./service-worker.js').catch(console.warn));
        }
    </script>
</body>
</html>
